<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><style>html,body{margin:0;width:100%;height:100%;background:#000;color:#73ff80;font:16px sans-serif}#player{width:100%;height:100%}#notice{position:absolute;top:8px;left:12px;pointer-events:none}</style></head><body><div id="player"></div><p id="notice">Loading YouTube…</p><script>
let player,ready=false;window.glassStatus='Loading YouTube…';
function onYouTubeIframeAPIReady(){player=new YT.Player('player',{videoId:'__VIDEO_ID__',playerVars:{autoplay:1,playsinline:1,controls:1,origin:'https://ph.marker.glassplayer'},events:{onReady:()=>{ready=true;document.getElementById('notice').hidden=true;player.playVideo()},onError:e=>{window.glassStatus='YouTube error '+e.data+' • video may not allow embedding';document.getElementById('notice').textContent=window.glassStatus},onAutoplayBlocked:()=>{window.glassStatus='Tap the YouTube play button to start'}}})}
window.glassCommand=function(action){if(!ready)return;if(action==='toggle'){player.getPlayerState()===1?player.pauseVideo():player.playVideo()}else if(action==='back'||action==='forward'){player.seekTo(Math.max(0,player.getCurrentTime()+(action==='back'?-10:10)),true)}};
setInterval(()=>{if(ready&&player.getPlayerState()!==-1){let s=player.getPlayerState();if(s===1||s===2)window.glassStatus='YOUTUBE • '+(s===1?'PLAYING':'PAUSED')+' • '+Math.floor(player.getCurrentTime())+'s'}},1000);
</script><script src="https://www.youtube.com/iframe_api"></script></body></html>
